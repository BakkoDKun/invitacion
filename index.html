<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: black;
    overflow-y: auto;
    display: flex;
    justify-content: center;   /* Centra horizontalmente */
  }

  .container {
    position: relative;
    width: 100%;
    max-width: 1366px;         /* Tamaño real de tu imagen */
    margin: 0 auto;            /* Asegura centrado */
  }

  .container img {
    width: 100%;               /* Hace la imagen responsive */
    height: auto;
    display: block;
  }

  /* Botones invisibles */
  .button {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <img src="invitacion.png" alt="Invitación">

  <!-- Botón 1 -->
  <div class="button"
       style="left:21.05%; top:51.45%; width:57.33%; height:0.87%;"
       onclick="window.open('https://maps.app.goo.gl/YnKUCjNY7t3Sw4wm9','_blank')"></div>

  <!-- Botón 2 -->
  <div class="button"
       style="left:19.02%; top:98.32%; width:58.17%; height:0.85%;"
       onclick="window.open('https://example2.com','_blank')"></div>

  <!-- Botón 3 -->
  <div class="button"
       style="left:22.55%; top:94%; width:58.6%; height:0.8%;"
       onclick="window.open('https://example3.com','_blank')"></div>

  <!-- Botón 4 -->
  <div class="button"
       style="left:22.45%; top:56.8%; width:55.88%; height:0.92%;"
       onclick="alert('Botón 4 presionado')"></div>
</div>

<!-- Música -->
<audio id="player" autoplay>
  <source src="https://docs.google.com/uc?export=download&id=1j7Ve0bxYR50EjW-dKElnd7X1c26I51EY" type="audio/mp3">
</audio>

</body>
</html>
