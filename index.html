<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: auto;
  }
  .container {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .container img {
    width: 100%;
    max-width: 1366px;
    height: auto;
    display: block;
  }

  .button {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }

  /* Botón para iniciar audio */
  #playBtn {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    z-index: 9999;
  }
</style>
</head>
<body>

<div class="container" style="position:relative;">
  <img src="invitacion.png" alt="Invitación">

  <div class="button" style="left:21.05%; top:51.45%; width:57.33%; height:0.87%; position:absolute;"
       onclick="window.open('https://maps.app.goo.gl/YnKUCjNY7t3Sw4wm9','_blank')"></div>

  <div class="button" style="left:19.02%; top:98.32%; width:58.17%; height:0.85%; position:absolute;"
       onclick="window.open('https://example2.com','_blank')"></div>

  <div class="button" style="left:22.55%; top:94.0%; width:58.6%; height:0.8%; position:absolute;"
       onclick="window.open('https://example3.com','_blank')"></div>

  <div class="button" style="left:22.45%; top:56.8%; width:55.88%; height:0.92%; position:absolute;"
       onclick="alert('Botón 4 presionado')"></div>
</div>

<!-- Audio SIN autoplay -->
<audio id="player" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="playBtn">🎵 Tocar para reproducir música</button>

<script>
const player = document.getElementById('player');
const btn = document.getElementById('playBtn');

// Reproducción al tocar
btn.addEventListener('click', () => {
  player.play();
  btn.style.display = 'none';
});
</script>

</body>
</html>
