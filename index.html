<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: auto; /* Permite scroll vertical */
  }
  .container {
    position: relative;
    display: inline-block;
  }
  .container img {
    display: block;
    width: 100%; /* Ajusta al ancho de la pantalla */
    height: auto; /* Mantiene proporciones */
  }
  /* Botones invisibles */
  .button {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <img src="invitacion.png" alt="Invitación">

  <!-- Boton 1 -->
  <div class="button" style="left: 15%; top: 49.45%; width: 40.7%; height: 0.85%;" 
       onclick="window.open('https://maps.app.goo.gl/YnKUCjNY7t3Sw4wm9','_blank')"></div>

  <!-- Boton 2 -->
  <div class="button" style="left: 13.5%; top: 94.15%; width: 42.3%; height: 0.82%;" 
       onclick="window.open('https://example2.com','_blank')"></div>

  <!-- Boton 3 -->
  <div class="button" style="left: 16.5%; top: 90.87%; width: 16.1%; height: 0.73%;" 
       onclick="window.open('https://example3.com','_blank')"></div>

  <!-- Boton 4 -->
  <div class="button" style="left: 16%; top: 54.57%; width: 39.7%; height: 0.87%;" 
       onclick="alert('Boton 4 presionado')"></div>
</div>
</div>

<!-- Música invisible -->
<audio autoplay loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

</body>
</html>
